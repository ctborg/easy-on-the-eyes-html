<!DOCTYPE html><html lang='en'><head><meta charset='utf-8'><title>Bench</title><link rel='stylesheet' href='/style.css'></head><body><main><section><h1>Hello <span>Bench</span></h1><p>Short text with <a href='https://example.com'>a link</a> and inline markup.</p><ul><li>First item</li><li>Second item</li><li>Third item</li></ul><article><h2>Longer section</h2><p>This paragraph is intentionally a little longer so the HTML formatter has to decide whether to keep the text compact or give it a little more room across multiple lines.</p></article></section></main><script>function demo(){const x=[1,2,3];return x.map(n=>n*2).join(',');}</script></body></html>
